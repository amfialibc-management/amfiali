<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 Προκηρύξεις</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f0f4f8;min-height:100vh}
nav{position:sticky;top:0;z-index:100;background:#5a1a6a;padding:10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
nav a{color:#fff;text-decoration:none;font-size:14px;opacity:.8}
nav a:hover{opacity:1}
nav .title{color:#fff;font-weight:700;font-size:16px;margin-right:auto}
.app{max-width:700px;margin:0 auto;padding:16px}
h2{font-size:20px;font-weight:700;color:#5a1a6a;margin-bottom:4px}
.subtitle{font-size:13px;color:#888;margin-bottom:20px}

/* Add form */
.add-card{background:#fff;border-radius:12px;padding:16px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);border-left:4px solid #5a1a6a;display:none}
.add-card h3{font-size:15px;font-weight:700;color:#5a1a6a;margin-bottom:12px}
.form-row{display:flex;flex-direction:column;gap:10px}
.form-row label{font-size:12px;font-weight:600;color:#555;margin-bottom:2px}
.form-row input,.form-row textarea,.form-row select{
  width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit
}
.form-row textarea{resize:vertical;min-height:70px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none}
.btn-purple{background:#5a1a6a;color:#fff}
.btn-purple:hover{background:#4a1258}
.btn-gray{background:#f0f0f0;color:#555}
.btn-gray:hover{background:#e0e0e0}
.btn-red{background:#c0392b;color:#fff}
.btn-red:hover{background:#a93226}
.btn-add{background:#5a1a6a;color:#fff;margin-bottom:14px}
#msg{font-size:13px;font-weight:600;display:none;margin-top:6px}

/* Prokirikseis list */
.prok-list{display:flex;flex-direction:column;gap:12px}
.prok-card{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 1px 6px rgba(0,0,0,.08);border-left:4px solid #5a1a6a;display:flex;align-items:flex-start;gap:12px}
.prok-icon{font-size:28px;line-height:1;flex-shrink:0;margin-top:2px}
.prok-body{flex:1;min-width:0}
.prok-title{font-size:15px;font-weight:700;color:#222;margin-bottom:4px}
.prok-desc{font-size:13px;color:#555;margin-bottom:8px;line-height:1.5}
.prok-link{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:#5a1a6a;text-decoration:none;padding:5px 12px;border:1.5px solid #5a1a6a;border-radius:7px}
.prok-link:hover{background:#f5eaff}
.prok-meta{font-size:11px;color:#aaa;margin-top:6px}
.prok-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.empty{text-align:center;color:#aaa;font-size:14px;padding:40px 0}
.cat-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-bottom:6px;background:#f0e6ff;color:#5a1a6a}
</style>
</head>
<body>

<nav>
  <span class="title">📋 Προκηρύξεις</span>
  <a href="index.html">🏠 Αρχική</a>
</nav>

<div class="app">
  <h2>Προκηρύξεις</h2>
  <div class="subtitle">Σύνδεσμοι πρωταθλημάτων & φορέων</div>

  <button class="btn btn-add" id="addBtn" style="display:none" onclick="toggleForm()">➕ Προσθήκη Προκήρυξης</button>

  <!-- Add / Edit form -->
  <div class="add-card" id="addCard">
    <h3 id="formTitle">➕ Νέα Προκήρυξη</h3>
    <div class="form-row">
      <div>
        <label>Τίτλος *</label>
        <input type="text" id="fTitle" placeholder="π.χ. Πρωτάθλημα Α2 Ανδρών 2026-27">
      </div>
      <div>
        <label>Περιγραφή</label>
        <textarea id="fDesc" placeholder="π.χ. Προκήρυξη ΕΣΑΚΕ για τη σεζόν 2026-27"></textarea>
      </div>
      <div>
        <label>Κατηγορία</label>
        <select id="fCat">
          <option value="Πρωτάθλημα">🏆 Πρωτάθλημα</option>
          <option value="Κύπελλο">🥈 Κύπελλο</option>
          <option value="Φορέας">🏛️ Φορέας</option>
          <option value="Άλλο">📄 Άλλο</option>
        </select>
      </div>
      <div>
        <label>Link *</label>
        <input type="url" id="fUrl" placeholder="https://...">
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-purple" onclick="saveProk()">💾 Αποθήκευση</button>
      <button class="btn btn-gray" onclick="toggleForm()">✕ Άκυρο</button>
      <span id="msg"></span>
    </div>
  </div>

  <!-- List -->
  <div class="prok-list" id="prokList">
    <p class="empty">Φόρτωση...</p>
  </div>
</div>

<script>
var firebaseConfig={apiKey:"AIzaSyCZZnZSz8zpChx-7ScaISKehoebtO1A-qY",authDomain:"amfiali-d773b.firebaseapp.com",projectId:"amfiali-d773b",storageBucket:"amfiali-d773b.firebasestorage.app",messagingSenderId:"972320918445",appId:"1:972320918445:web:e4674ddb6b790c07efaf24"};
firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();
var auth=firebase.auth();

var _role=localStorage.getItem('amfiali_role')||'viewer';
var _isAdmin=(_role==='admin');
var _editId=null;

// Auth check
var today=new Date().toDateString();
if(localStorage.getItem('amfiali_last_login')!==today){window.location.replace('login.html');}

auth.onAuthStateChanged(function(user){
  if(!user){window.location.replace('login.html');return;}
  if(_role!=='admin'){
    var perms=JSON.parse(localStorage.getItem('amfiali_permissions')||'[]');
    if(perms.indexOf('prokirikseis')<0){
      document.body.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui;gap:12px"><div style="font-size:48px">🔒</div><div style="font-size:18px;font-weight:700;color:#333">Δεν έχετε πρόσβαση</div><div style="font-size:13px;color:#888">Επικοινωνήστε με τον διαχειριστή</div><a href="index.html" style="margin-top:10px;padding:10px 20px;background:#5a1a6a;color:#fff;border-radius:8px;text-decoration:none;font-weight:600">← Αρχική</a></div>';
      return;
    }
  }
  if(_isAdmin){
    document.getElementById('addBtn').style.display='inline-flex';
  }
  loadProk();
});

function toggleForm(editId){
  var card=document.getElementById('addCard');
  var isOpen=card.style.display==='block';
  if(isOpen&&!editId){
    card.style.display='none';
    clearForm();
    return;
  }
  card.style.display='block';
  if(!editId){
    clearForm();
    document.getElementById('formTitle').textContent='➕ Νέα Προκήρυξη';
  }
  card.scrollIntoView({behavior:'smooth'});
}

function clearForm(){
  _editId=null;
  document.getElementById('fTitle').value='';
  document.getElementById('fDesc').value='';
  document.getElementById('fCat').value='Πρωτάθλημα';
  document.getElementById('fUrl').value='';
  document.getElementById('msg').style.display='none';
  document.getElementById('formTitle').textContent='➕ Νέα Προκήρυξη';
}

function showMsg(txt,ok){
  var el=document.getElementById('msg');
  el.textContent=txt;
  el.style.color=ok?'#3B6D11':'#721c24';
  el.style.display='inline';
  setTimeout(function(){el.style.display='none';},3000);
}

function catIcon(cat){
  if(cat==='Πρωτάθλημα')return '🏆';
  if(cat==='Κύπελλο')return '🥈';
  if(cat==='Φορέας')return '🏛️';
  return '📄';
}

async function saveProk(){
  var title=document.getElementById('fTitle').value.trim();
  var desc=document.getElementById('fDesc').value.trim();
  var cat=document.getElementById('fCat').value;
  var url=document.getElementById('fUrl').value.trim();
  if(!title){showMsg('Βάλε τίτλο!',false);return;}
  if(!url){showMsg('Βάλε link!',false);return;}
  if(!url.startsWith('http')){showMsg('Το link πρέπει να αρχίζει με https://',false);return;}
  try{
    var data={title:title,desc:desc,cat:cat,url:url,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
    if(_editId){
      await db.collection('prokirikseis').doc(_editId).update(data);
      showMsg('✅ Ενημερώθηκε!',true);
    }else{
      data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('prokirikseis').add(data);
      showMsg('✅ Προστέθηκε!',true);
    }
    clearForm();
    document.getElementById('addCard').style.display='none';
    loadProk();
  }catch(e){showMsg('Σφάλμα: '+e.message,false);}
}

async function loadProk(){
  var el=document.getElementById('prokList');
  try{
    var snap=await db.collection('prokirikseis').orderBy('createdAt','desc').get();
    if(snap.empty){
      el.innerHTML='<p class="empty">Δεν υπάρχουν προκηρύξεις ακόμα.</p>';
      return;
    }
    el.innerHTML=snap.docs.map(function(d){
      var p=d.data();
      var icon=catIcon(p.cat||'Άλλο');
      var dateStr='';
      if(p.createdAt&&p.createdAt.toDate){
        dateStr=p.createdAt.toDate().toLocaleDateString('el-GR');
      }
      var adminBtns=_isAdmin
        ?'<button class="btn btn-gray" style="font-size:11px;padding:5px 10px" onclick="editProk(\''+d.id+'\')">✏️</button>'
         +'<button class="btn btn-red" style="font-size:11px;padding:5px 10px" onclick="deleteProk(\''+d.id+'\')">🗑️</button>'
        :'';
      return '<div class="prok-card">'
        +'<div class="prok-icon">'+icon+'</div>'
        +'<div class="prok-body">'
        +'<div class="cat-badge">'+( p.cat||'Άλλο')+'</div>'
        +'<div class="prok-title">'+p.title+'</div>'
        +(p.desc?'<div class="prok-desc">'+p.desc+'</div>':'')
        +'<a class="prok-link" href="'+p.url+'" target="_blank" rel="noopener">🔗 Άνοιγμα σελίδας</a>'
        +(dateStr?'<div class="prok-meta">Προστέθηκε: '+dateStr+'</div>':'')
        +'</div>'
        +(adminBtns?'<div class="prok-actions">'+adminBtns+'</div>':'')
        +'</div>';
    }).join('');
  }catch(e){
    el.innerHTML='<p class="empty">Σφάλμα φόρτωσης: '+e.message+'</p>';
  }
}

window.editProk=async function(id){
  var snap=await db.collection('prokirikseis').doc(id).get();
  var p=snap.data();
  _editId=id;
  document.getElementById('fTitle').value=p.title||'';
  document.getElementById('fDesc').value=p.desc||'';
  document.getElementById('fCat').value=p.cat||'Πρωτάθλημα';
  document.getElementById('fUrl').value=p.url||'';
  document.getElementById('formTitle').textContent='✏️ Επεξεργασία Προκήρυξης';
  document.getElementById('addCard').style.display='block';
  document.getElementById('addCard').scrollIntoView({behavior:'smooth'});
};

window.deleteProk=async function(id){
  if(!confirm('Διαγραφή προκήρυξης;'))return;
  try{
    await db.collection('prokirikseis').doc(id).delete();
    loadProk();
  }catch(e){alert('Σφάλμα: '+e.message);}
};
</script>
</body>
</html>
